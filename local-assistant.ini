[models]
; auto detects CUDA; use cpu on computers without a supported NVIDIA GPU.
backend=auto
chatPort=8080
embeddingPort=8081
chatModel=models/Qwen3-VL-8B-Instruct-Q4_K_M.gguf
embeddingModel=models/embeddinggemma-300m-qat-Q8_0.gguf
startupTimeoutMs=120000
chatMmproj=models/mmproj-Qwen3-VL-8B-Instruct-F16.gguf
; Conservative offload for this laptop's 6 GiB GPU; increase only after measuring VRAM.
chatGpuLayers=20
chatContextSize=8192
mmprojGpu=true

[documents]
maxFileSizeMiB=100
; Optional full path to soffice.exe. Otherwise installed Microsoft Word converts DOC.
soffice=

[storage]
; Private PostgreSQL cluster, separate from system installations.
port=55432
dataDirectory=storage-data
